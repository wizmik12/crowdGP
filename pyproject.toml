[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdgp"
version = "0.1.0"
description = "Gaussian-process models for learning from crowds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "tensorflow>=2.11",
    "gpflow>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
examples = ["matplotlib>=3.5"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "black>=24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/crowdgp/tests"]
markers = [
    "slow: exercises real optimisation over many iterations (deselect with -m \"not slow\")",
]
