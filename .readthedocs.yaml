# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The docs build only needs the mkdocs/mkdocstrings toolchain, not the
# library's own runtime dependencies (tensorflow, gpflow): mkdocstrings'
# python handler reads docstrings via static analysis (griffe), never by
# importing crowdgp itself. Keeping TensorFlow off the build keeps it fast
# and inside Read the Docs' free-tier resource limits.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
